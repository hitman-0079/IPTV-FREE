<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>StreamFlix Live</title>
  <link rel="stylesheet" href="https://cdn.plyr.io/3.7.8/plyr.css" />
  <link rel="stylesheet" href="styles.css" />
  <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
  <script src="https://cdn.plyr.io/3.7.8/plyr.polyfilled.js"></script>
</head>
<body>
  <div class="app-container">
    <header class="navbar">
      <div class="logo" id="brandLogo" tabindex="0">StreamFlix</div>
      <div class="playlist-controls">
        <select id="playlistSelect">
          <!-- General / Global -->
          <option value="https://iptv-org.github.io/iptv/index.m3u">IPTV-Org (Global Default - Full)</option>
          
          <!-- Categories -->
          <option value="https://iptv-org.github.io/iptv/categories/news.m3u">Category: News</option>
          <option value="https://iptv-org.github.io/iptv/categories/sports.m3u">Category: Sports</option>
          <option value="https://iptv-org.github.io/iptv/categories/movies.m3u">Category: Movies</option>
          <option value="https://iptv-org.github.io/iptv/categories/music.m3u">Category: Music</option>
          <option value="https://iptv-org.github.io/iptv/categories/entertainment.m3u">Category: Entertainment</option>
          <option value="https://iptv-org.github.io/iptv/categories/documentary.m3u">Category: Documentary</option>

          <!-- Languages -->
          <option value="https://iptv-org.github.io/iptv/languages/eng.m3u">Language: English</option>
          <option value="https://iptv-org.github.io/iptv/languages/spa.m3u">Language: Spanish</option>
          <option value="https://iptv-org.github.io/iptv/languages/fra.m3u">Language: French</option>
          <option value="https://iptv-org.github.io/iptv/languages/deu.m3u">Language: German</option>
          <option value="https://iptv-org.github.io/iptv/languages/hin.m3u">Language: Hindi</option>

          <!-- Countries -->
          <option value="https://iptv-org.github.io/iptv/countries/us.m3u">Country: United States</option>
          <option value="https://iptv-org.github.io/iptv/countries/uk.m3u">Country: United Kingdom</option>
          <option value="https://iptv-org.github.io/iptv/countries/ca.m3u">Country: Canada</option>
          <option value="https://iptv-org.github.io/iptv/countries/in.m3u">Country: India</option>
        </select>
        <input type="text" id="m3uUrlInput" placeholder="Or enter custom M3U/M3U8 URL..." />
        <button id="loadBtn">Load M3U</button>
      </div>
    </header>

    <main class="main-content">
      <section class="player-section">
        <div class="video-wrapper">
          <video id="videoPlayer" crossorigin playsinline></video>
        </div>
        <div class="player-info">
          <div class="channel-details">
            <h2 id="currentChannelName">Select a Broadcast</h2>
            <div id="statusBar">Status: Ready</div>
          </div>
          <div class="playback-actions">
            <button id="prevBtn" title="Previous Channel">‹ Prev</button>
            <button id="stopBtn" title="Stop Auto-Skip">Stop Skip</button>
            <button id="nextBtn" title="Next Channel">Next ›</button>
          </div>
        </div>
      </section>

      <aside class="sidebar">
        <div class="sidebar-header">
          <input type="text" id="channelSearch" placeholder="Search channels..." />
          <div id="channelCount">Channels: 0</div>
        </div>
        <ul id="channelList" class="channel-list"></ul>
      </aside>
    </main>
  </div>

  <script src="script.js"></script>
</body>
</html>
